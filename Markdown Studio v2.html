function cisco(raw){const p=/(!.*$)|(^\s*(?:[A-Za-z0-9_.-]+)(?:\([^)]+\))?[#>])|(\b(?:show|configure|terminal|interface|vlan|ip|address|no|shutdown|write|memory|copy|enable|disable|switchport|description|logging|reload)\b)|(\b(?:GigabitEthernet|TenGigabitEthernet|FastEthernet|Ethernet|Port-channel|Loopback|Vlan)\s*[\w/.-]*)|(\b(?:\d{1,3}\.){3}\d{1,3}(?:\/\d{1,2})?\b)/gim;let out='',last=0,m;while(m=p.exec(raw)){out+=esc(raw.slice(last,m.index));const c=m[1]?'comment':m[2]||m[3]?'command':m[4]?'interface':'address';out+='<span class="'+c+'">'+esc(m[0])+'</span>';last=m.index+m[0].length}return out+esc(raw.slice(last))}
function addCode(raw,lang='cisco'){if(['mermaid','flowchart'].includes(lang.toLowerCase()))return addFlowchart(raw);const isCisco=['cisco','ios','iosxe','cisco-ios','cisco-iosxe'].includes(lang.toLowerCase());const wrap=document.createElement('div');wrap.className='code-block';wrap.dataset.language=isCisco?'cisco':lang;wrap.contentEditable='true';wrap.setAttribute('aria-label',(isCisco?'Cisco':'Code')+' block — editable');wrap.innerHTML='<div class="code-toolbar" contenteditable="false"><span>'+ (isCisco?'Cisco IOS / IOS-XE':esc(lang)) +'</span><button class="copy-code" type="button">Copy</button></div><pre><code contenteditable="true" spellcheck="false" class="language-'+(isCisco?'cisco':esc(lang))+'">'+(isCisco?cisco(raw):esc(raw))+'</code></pre>';editor.append(wrap)}
function inlineHTML(text){return esc(text).replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(\*\*|__)(.+?)\1/g,'<strong>$2</strong>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)|(?<!_)_([^_\n]+)_(?!_)/g,'<em>$1$2</em>').replace(/&lt;(https?:\/\/[^ >]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}

function fallbackParse(md){editor.innerHTML='';const lines=md.replace(/\r/g,'').split('\n');let i=0;while(i<lines.length){let l=lines[i];if(/^```/.test(l)){const lang=l.slice(3).trim()||'text',code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);if(i<lines.length)i++;addCode(code.join('\n'),lang);continue}if(!l.trim()){i++;continue}const h=l.match(/^(#{1,6})\s+(.+?)\s*#*$/);if(h){appendText('h'+h[1].length,h[2]);i++;continue}if(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/.test(l)){editor.append(document.createElement('hr'));i++;continue}if(l.includes('|')&&i+1<lines.length&&isTableRule(lines[i+1])){const table=document.createElement('table'),head=table.createTHead().insertRow();cells(l).forEach(v=>{const c=document.createElement('th');c.innerHTML=inlineHTML(v);head.append(c)});i+=2;const body=table.createTBody();while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){const row=body.insertRow();cells(lines[i++]).forEach(v=>{const c=row.insertCell();c.innerHTML=inlineHTML(v)})}editor.append(table);continue}if(/^>\s?/.test(l)){const quote=[];while(i<lines.length&&/^>\s?/.test(lines[i]))quote.push(lines[i++].replace(/^>\s?/,''));const b=document.createElement('blockquote');b.innerHTML=inlineHTML(quote.join('\n')).replace(/\n/g,'<br>');editor.append(b);continue}const list=l.match(/^\s*([-*+]|\d+\.)\s+(.+)$/);if(list){const ordered=/\d+\./.test(list[1]),el=document.createElement(ordered?'ol':'ul');while(i<lines.length){const m=lines[i].match(/^\s*([-*+]|\d+\.)\s+(.+)$/);if(!m||(/\d+\./.test(m[1])!==ordered))break;const li=document.createElement('li'),task=m[2].match(/^\[([ xX])\]\s+(.+)$/);if(task){li.dataset.task='true';const box=document.createElement('input');box.type='checkbox';box.checked=/x/i.test(task[1]);box.contentEditable='false';li.append(box);const span=document.createElement('span');span.innerHTML=inlineHTML(task[2]);li.append(span)}else li.innerHTML=inlineHTML(m[2]);el.append(li);i++}editor.append(el);continue}appendText('p',l);i++}}
function inlineMarkdown(node){if(node.nodeType===3)return node.nodeValue;const tag=node.nodeName.toLowerCase(),inside=[...node.childNodes].map(inlineMarkdown).join('');if(tag==='strong'||tag==='b')return '**'+inside+'**';if(tag==='em'||tag==='i')return '*'+inside+'*';if(tag==='del'||tag==='s'||tag==='strike')return '~~'+inside+'~~';if(tag==='code')return '`'+node.textContent+'`';if(tag==='a')return '['+inside+']('+node.getAttribute('href')+')';if(tag==='img')return '!['+(node.getAttribute('alt')||'')+']('+(node.getAttribute('src')||'')+')';if(tag==='br')return '\n';return inside}
function toMarkdown(){if(gfmDocumentClean)return gfmSource;let lines=[];[...editor.children].forEach(el=>{if(el.classList.contains('flowchart-block')){lines.push('```mermaid',el.querySelector('.flowchart-source').value,'```','');return}if(el.classList.contains('code-block')){const lang=el.dataset.language||'text';lines.push('```'+lang,el.querySelector('code').textContent,'```','');return}const tag=el.tagName.toLowerCase(),text=inlineMarkdown(el).trim();if(/^h[1-6]$/.test(tag))lines.push('#'.repeat(+tag[1])+' '+text,'');else if(tag==='hr')lines.push('---','');else if(tag==='blockquote')lines.push(...text.split('\n').map(x=>'> '+x),'');else if(tag==='ul'||tag==='ol'){[...el.children].forEach((li,n)=>{const value=li.dataset.task==='true'?'['+(li.querySelector('input').checked?'x':' ')+'] '+inlineMarkdown(li.querySelector('span')).trim():inlineMarkdown(li).trim();lines.push((tag==='ol'?(n+1)+'. ':'- ')+value)});lines.push('')}else if(tag==='table'){const rows=[...el.rows].map(row=>[...row.cells].map(cell=>inlineMarkdown(cell).trim().replace(/\|/g,'\\|')));if(rows.length){lines.push('| '+rows[0].join(' | ')+' |','| '+rows[0].map(()=>'---').join(' | ')+' |');rows.slice(1).forEach(row=>lines.push('| '+row.join(' | ')+' |'));lines.push('')}}else if(text)lines.push(text,'')});return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n'}
function hydrateGfm(){editor.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});editor.querySelectorAll('pre > code').forEach(code=>{const pre=code.parentElement,match=[...code.classList].find(c=>c.startsWith('language-')),lang=match?match.slice(9):'text';if(['mermaid','flowchart'].includes(lang.toLowerCase())){const flowchartBlock=makeFlowchartBlock(code.textContent);pre.replaceWith(flowchartBlock);renderFlowchart(flowchartBlock);return}const isCisco=['cisco','ios','iosxe','cisco-ios','cisco-iosxe'].includes(lang.toLowerCase()),wrap=document.createElement('div');wrap.className='code-block';wrap.dataset.language=isCisco?'cisco':lang;wrap.contentEditable='true';wrap.innerHTML='<div class="code-toolbar" contenteditable="false"><span>'+(isCisco?'Cisco IOS / IOS-XE':esc(lang))+'</span><button class="copy-code" type="button">Copy</button></div><pre><code contenteditable="true" spellcheck="false" class="language-'+(isCisco?'cisco':esc(lang))+'">'+(isCisco?cisco(code.textContent):esc(code.textContent))+'</code></pre>';pre.replaceWith(wrap)});editor.querySelectorAll('li').forEach(li=>{const box=li.querySelector(':scope > input[type=checkbox]');if(box){li.dataset.task='true';box.disabled=false;box.contentEditable='false';const span=document.createElement('span');while(box.nextSibling)span.append(box.nextSibling);li.append(span)}})}

function supportedFile(name){return /\.(md|markdown|txt)$/i.test(name)}
async function populateTree(folder,target){target.replaceChildren();let entries=[];try{for await(const entry of folder.values())entries.push(entry)}catch{target.textContent='Folder permission was lost';return}entries.sort((a,b)=>(a.kind===b.kind?a.name.localeCompare(b.name):a.kind==='directory'?-1:1));if(!entries.length){target.textContent='No files';return}for(const entry of entries){if(entry.kind==='directory'){const details=document.createElement('details'),summary=document.createElement('summary'),children=document.createElement('div');details.className='tree-dir';summary.textContent='📁 '+entry.name;children.className='tree-children';details.append(summary,children);details.addEventListener('toggle',async()=>{if(details.open&&!details.dataset.loaded){details.dataset.loaded='true';await populateTree(entry,children)}});target.append(details)}else if(supportedFile(entry.name)){const button=document.createElement('button');button.className='tree-file';button.type='button';button.textContent='📄 '+entry.name;button.fileHandle=entry;target.append(button)}}}
